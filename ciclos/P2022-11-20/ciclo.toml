[tese]
pontos = [
  "A tradução honesta do tema: '2000 anos depois, ninguém entendeu buiufas do que Jesus fez ou tentou fazer' — nem os espíritos explicaram convenientemente, nem a doutrina espírita, nem a Igreja, nem as religiões cristãs. O X da história: o homem Jesus leu as escrituras, soube que era o Messias anunciado e disse 'eu não vou fazer isso' — recusou-se a cumprir a agenda violenta da velha aliança (os critérios várnicos, de Enoque a Javé) e estragou milênios de história. A nova aliança que ele propôs 'não é uma ideia de um gênio, foi uma questão de limite humano' — ele sentiu o limite de se submeter e nos convida a senti-lo também, criando o próprio código filosófico de conduta.",
  "A velha aliança: os termos imutáveis de Javé ('Eu não mudo uma vírgula de nada do que eu prometo'), anunciados pelos profetas, com raiz na agenda de Enoque ('o maior responsável pelos termos da velha aliança'; os 363/366 livros ditados a Matusalém; a cópia Metatron travada) e no jogo várnico/cármico dos demos (varna = talento; o karma 'não foi o espiritismo que inventou'; a doença deles começa na questão várnica). A Paixão como penalidade: Javé citava Jó (cujo 'Satã' é Belial) e Jesus, mesmo com superpoderes, 'podia ter bifurcado a história, mas não bifurcou' — deixou-se crucificar.",
  "O desfecho: Sofia rompeu com Javé e carimbou a nova aliança no Apocalipse — 'botou Javé sentado num trono, os sete livros selados... nem sabia tirar os selos'; a revelação do ressuscitado virou o gnosticismo judaico-cristão, cancelado pela Igreja (Nag Hammadi, 1945); 'o cristianismo foi totalmente distorcido' (leitura do autor). 'A nova aliança primeiro precisa ser compreendida pelos seres humanos para que depois Javé aceite' — Javé foi desativado sem aceitar; 'a locomotiva já partiu': o planejamento do quarto logos e a especiação humana já estão em curso desde o colapso de 2007; a pulsação digna (a onda que inibe os seres; o fogo que dói em quem se aproxima) e as negentropias ('o pedaço de pau resistente que a correnteza tenta arrastar') são a postura possível.",
]

[definicoes]
RC-860 = "A 'nova aliança' é a proposta de Jesus contra a velha aliança dos pactos de Javé: 'a nova aliança que Jesus propôs não é uma ideia de um gênio, foi uma questão de limite humano' — o homem Jesus leu as escrituras, soube que era o Messias e recusou-se a cumprir os termos imutáveis de Javé ('Eu não mudo uma vírgula de nada do que eu prometo'), estragando milênios de história e se deixando crucificar como penalidade. 'Primeiro precisa ser compreendida pelos seres humanos para que depois Javé aceite' — Javé jamais a aceitou e foi desativado sem aceitar (P2022-11-20)."
RC-858 = "Os 'desígnios proféticos' são a profecia como instrumento de domínio e sua desconexão: 'a frase ressurreição na época em que Isaías viveu, ela não foi efetivamente colocada nesses termos' — 'Isso foi uma manipulação feita posteriormente'. O mesmo critério vale para os livros de Enoque: o catolicismo interpolou São Miguel e São Rafael numa tradução posterior aos fatos — 'essa é a interpolação posterior', o drama desses livros (P2022-11-20)."
RC-865 = "A 'pulsação digna' é a pulsação alinhada a conceitos supremos: 'Esses seres, eles têm que receber a onda da pulsação digna de um ser humano ou de vários seres humanos para que eles essa pulsação os inibe e eles não podem fazer nada' — quando o humano cansa de pulsar, eles podem chegar e bater; a pulsação contundente funciona como o fogo de uma fogueira que dói em quem dela se aproxima (P2022-11-20)."
RC-870 = "As 'fórmulas mentais' são o código dos seres do universo vizinho (demos/extísicos), contraposto ao DNA humano: 'na condição demo os seres têm fórmulas mentais. Nós temos DNA' — os demos não têm DNA; 'deposito o que resta de suas fórmulas mentais' (Vishnu a Brama sobre a linhagem humana); 'para que Javé gastasse as últimas fórmulas mentais dele' (Shiva). O DNA humano, em sendo trabalhado, produz sequências genéticas e genótipos — e provoca mutações adaptativas; os demos dependem do temperamento (critérios várnicos). O humano pode introduzir '1000 novos conhecimentos e 1000 coisas por dia' (P2022-11-20)."

