# ciclo.toml — ciclo leve P2018-12-15 · andaime escrito por `motor.py novo`
# ──────────────────────────────────────────────────────────────────────────────
# Toda curadoria mora AQUI. Regras vigentes: DESPACHO-DA-ESTEIRA-LEVE-2026-08-29.md.
# O que está vazio abaixo é pendência do aplicador, não estado da Base: o portão D
# confere cada número declarado e o livro-razão responde pelo que foi recusado.

sigla = "P2018-12-15"
titulo = "Terra Atlantis – Aprofundamento"
data_fonte = "15/12/2018"
pasta_fonte = "ciclos/P2018-12-15"
arquivo_fonte = "original.txt"
pacote = "pacote_P2018-12-15.txt"
sha256_fonte = "5d26edf6650dd3451539e2ea32ed3e413eab59b654345d38d2281dbf6602a0fe"

baseline_commit = "d97a39b"   # HEAD de onde o ciclo partiu; o portão D mede DELTA
portoes_ativos = ["A", "B", "C", "D"]
max_perolas = 25
exportar_candidatas = false       # true só em ensaio declarado: o portão real é `aprovada`

cobertura = "não-transcrita neste formato (deliberado: despacho de 29/08/2026 encerra a exigência de apostila integral); fonte integral preservada em original.txt, selada por SHA-256 na entrada; livro-razão de âncoras registra cada span encontrado, aceito e recusado"
teto = "suspenso-com-cadencia"
termos_novos = ["RC-843 Eru Ilúvatar (criador no Silmarillion)", "RC-844 Melkor (o filho dissonante)", "RC-845 Nada Brahma (tudo é som)"]
veto_lexico = ["p****", "m****", "b******", "e******"]
fichas_que_nomeiam_grupo = []

[delta_esperado]
arquivos = 8      # fichas materializadas nesta devolutiva (a fila aberta, ordem do Curador)
ficha_true = 8   # viradas no cadastro: as mesmas 8 (False → True)
termos = 3       # RC-843/844/845; RC-846 foi rebaixado (redirect → RC-074) nesta devolutiva
relacoes = 1     # RC-101 'manifesta-se-em' RC-499 (Shamb-Aha = forno Awaymaion)
vinculos = 20    # os 20 códigos do pacote carregam P2018-12-15 (RC-074 entra; RC-846 sai)

[materializar]
codigos = ["RC-010", "RC-025", "RC-062", "RC-101", "RC-238", "RC-843", "RC-844", "RC-845"]  # ordem do Curador na devolutiva

[vitorias]
provas = []         # uma linha por vitória: "RC-xxx = <afirmativa> | prova: <trecho>"
# A prova é um trecho LITERAL da `## Ampliação — <SIGLA>` da ficha: o motor confere byte a
# byte depois de ampliar e o §0 do dossiê só imprime o que passou. Mesa vazia é lícita (nem
# todo ciclo vence algo novo); linha sem `| prova:` aborta — vitória narrada não é vitória.
[ampliar]
codigos = []      # vazio = todos os códigos do pacote que já têm arquivo (inclui RC-074)

[tese]
pontos = [
  "Antes da vida biológica havia o PIA (peso da inevitabilidade ancestral, RC-716), mapeado por Moros (RC-454), que com Ananque engendrou as Moiras (RC-467); o padrão só foi rompido por Morlens (RC-772), o ser sem lacre, e por Sofia (RC-009), o primeiro ser livre do PIA.",
  "O Silmarillion de Tolkien (Eru Ilúvatar RC-843 / Melkor RC-844) e o sânscrito (Nada Brahma RC-845, 'tudo é som') são leituras paralelas da mesma queda primordial: a criação como vibração, rompida pela dissonância do filho que não alcançou a harmonia.",
  "O Nidana (RC-154, 'código podre adaptado às circunstâncias biológicas') é a molécula-mãe que mistura o código do criador aos códigos neutros, e a colmeia (RC-176/RC-175) é o regime Javé↔clones que só os biodemos e depois o humano romperam.",
  "Shamb-Aha (RC-101) é o forno Awaymaion (RC-499) disfarçado de realidade, no mesmo molde em que Alt´Lam (RC-018) é a esfera disfarçada; a Era Sapiens (RC-238) fecha com Lemion/Len Mion (RC-074), a vinda de Jesus e a ascensão do nazismo.",
]

[definicoes]
RC-010 = "Terra Atlantis / Atlântida: a única nave esfera que restou das diversas que chegaram à Terra na rebelião de Lúcifer; camuflada como uma ilha — origem dos mitos do paraíso terrestre, da idade de ouro e dos campos elísios."
RC-025 = "Asphezian (STT 'Aspesian'): a nave-fábrica que aportou no planeta Zian (Capela) há ~270 milhões de anos com um pequeno número de seres — representantes do preposto universal; onde depois os Vol/Val foram engendrados em casulos."
RC-062 = "Experiência Gron: a operação magnética que alterou a fase vibratória de 983 dos 1.641 biodemos agrupados em torno da esfera; os que mudaram passaram a constituir a cidadela Alt´Lam Gron (RC-018), enquanto os demais permaneceram na Terra."
RC-101 = "Shamb-Aha (STT 'Shambaá/Chambarrá'): o forno replicador Awaymaion (RC-499) disfarçado de realidade — uma realidade alternativa vinculada ao forno, no mesmo molde em que Alt´Lam é a esfera disfarçada; precursora da astralização (RC-026)."
RC-238 = "Era Sapiens (STT 'Era Sápens'): o livro (e a era) sobre a interação de Lemion/Len Mion (RC-074) com a vinda de Jesus e a ascensão do nazismo — o desfecho da rebelião no mundo humano."
RC-843 = "Eru Ilúvatar (STT 'Heru/éu iluvatar'): o criador no Silmarillion de Tolkien — leitura terrena de Prabrajna/Brahma (RC-152) antes da queda; a 'música da criação' (Ainulindalê) ecoa o Nada Brahma (RC-845)."
RC-844 = "Melkor (STT 'Melcor'): o filho de Eru que não alcançou a harmonia ressonante e introduziu a dissonância na criação — analogia ao vírus primordial / rompimento do lacre de Lúcifer (RC-002)."
RC-845 = "Nada Brahma (sânscrito, STT 'nada brama'): 'tudo é som' — a cosmogonia como vibração, a 'música da criação' que precede a matéria (teoria das cordas)."

