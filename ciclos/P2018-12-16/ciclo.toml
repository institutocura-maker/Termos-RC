[vitorias]
provas = []         # uma linha por vitória: "RC-xxx = <afirmativa> | prova: <trecho>"
# A prova é um trecho LITERAL da `## Ampliação — <SIGLA>` da ficha: o motor confere byte a
# byte depois de ampliar e o §0 do dossiê só imprime o que passou. Mesa vazia é lícita (nem
# todo ciclo vence algo novo); linha sem `| prova:` aborta — vitória narrada não é vitória.
[ampliar]
codigos = []      # vazio = todos os códigos do pacote que já têm arquivo

[tese]
pontos = [
  "Após a implosão de Lúcifer (RC-078) diante do Jesus crucificado, Len Mion/Satã (RC-074) assume o comando do QG da rebelião e torna-se, na avaliação do autor, 'muito pior que Javé' — não por criar, mas por controlar processos, com a mente mais bem aplicada por ~22.000 anos.",
  "Lemion disputa a linhagem de Adão com os agentes de Sofia (os seres Aia/Aye, RC-031): tenta cooptar Sete (daí o nome 'Satã', RC-594), acompanha Enoque (RC-489), detesta Judas Iscariotes (= Ielan, RC-365) e, vencido por Jesus/Sofia (RC-009), volta-se ao mundo humano pela teurgia e pela Igreja.",
  "O desfecho é a Era Sapiens (RC-238), fechada no nazismo: Lemion domina Hitler (RC-239) pela 'voz', operando por trás das sociedades Vril (RC-847) e Thule (RC-848), da médium Maria Orsic (RC-846) e do circuito que inclui Nicola Tesla (RC-849).",
]

[definicoes]
RC-846 = "Maria Orsic (STT 'Maria Orstic/Rossique'): médium vidente da Sociedade Vril (RC-847) que, com as 'Ringles', recebia mensagens em línguas antigas (sumério-acadiano) repassando a 'ciência perdida' — Lemion (RC-074) operava por trás dessa raça, municiando o salto tecnológico nazista."
RC-847 = "Sociedade Vril (STT 'sociedade do frio/vila'): fundada em 1902, só de mulheres médiuns ('frioistas'); recebia mensagens de uma raça alienígena que propunha repassar a 'ciência perdida' da época dos deuses para que a Alemanha desenvolvesse armas e dominasse o mundo."
RC-848 = "Sociedade Thule (STT 'sociedade Turno/Tudo'): a influência esotérica de Rudolf von Sebottendorf (1918), que estudava a 'Turciade' e o governo oculto desde os hiperbóreos; Himmler comandava o castelo de Wewelsburg como laboratório da paranormalidade alemã."
RC-849 = "Nicola Tesla (figura histórica): recebia mensagens em sânscrito e as reproduzia — no mesmo circuito mediúnico de Maria Orsic (RC-846); morreu em 1943."
RC-239 = "Hitler (STT 'Rita/Rit'): obedecia a uma voz — Lemion (RC-074) — que o preservava e o conduzia como 'novo Messias' alemão; o palestrante ancora na pesquisa do livro 'A Mente de Hitler' (Langer/CIA)."
RC-376 = "José de Arimatéia: uma espécie de 'segundo pai' de Jesus; riquíssimo (minas, caravanas, cidadania romana), sustentava a carpintaria de Jesus e Tiago sem se impor."
RC-031 = "Aya e Aye: os agentes de Sofia que queriam influenciar Sete; Lemion disputou Sete com o Zaia (Aia), cada um em nome de seu lado."

