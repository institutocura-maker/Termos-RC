RC-228 = ["**Grafia STT:** 'Sileno'/'Silênio' = Sileno. O episódio no contexto do rei Midas (U0021)."]
RC-305 = ["**Grafia STT:** 'Temis'/'Tenes'/'Tex' = Têmis. Deusa dos juramentos; a 1ª mutação genética de racionalidade limpa."]
RC-398 = ["**Grafia STT:** 'toatas de ganã' = Thuata de Dannan. Chegaram queimando os navios; astralizaram-se em fadas/gnomos."]
RC-109 = ["**Grafia STT:** 'Vol' / 'Família V' = Val. As quatro famílias da deflagração: Iel, Cromon, Mion e Chamon."]
RC-841 = ["**Grafia STT:** 'cronos' = Cronos. Genealogia Uranos → Cronos (Titãs) → Zeus (Olimpianos)."]
RC-842 = ["**Grafia STT:** 'milesanos' = Milésios. Herdaram o conhecimento druídico e fundaram as origens do Colégio."]
