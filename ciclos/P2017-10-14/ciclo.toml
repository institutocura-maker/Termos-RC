# Toda curadoria mora AQUI. Regras vigentes: DESPACHO-DA-ESTEIRA-LEVE-2026-08-29.md.
# O que está vazio abaixo é pendência do aplicador, não estado da Base: o portão D
# confere cada número declarado e o livro-razão responde pelo que foi recusado.

sigla = "P2017-10-14"
titulo = "Da Base Atlan ao Colégio Druídico"
data_fonte = "14/10/2017"
pasta_fonte = "ciclos/P2017-10-14"
arquivo_fonte = "original.txt"
pacote = "pacote_P2017-10-14.txt"
sha256_fonte = "fb7619e4190287e6781a95d17f2a457bc148676b63057c7ef60a1670baf5694d"

baseline_commit = "14fb99e"   # HEAD de onde o ciclo partiu; o portão D mede DELTA
portoes_ativos = ["A", "B", "C", "D"]
max_perolas = 25
exportar_candidatas = false       # true só em ensaio declarado: o portão real é `aprovada`

cobertura = "não-transcrita neste formato (deliberado: despacho de 29/08/2026 encerra a exigência de apostila integral); fonte integral preservada em original.txt, selada por SHA-256 na entrada; livro-razão de âncoras registra cada span encontrado, aceito e recusado"
teto = "suspenso-com-cadencia"
termos_novos = ["RC-841 Cronos (titã)", "RC-842 Milésios (raça da Irlanda)"]
veto_lexico = ["p****", "m****", "b******", "e******"]
fichas_que_nomeiam_grupo = []

[delta_esperado]
arquivos = 8      # fichas materializadas nesta devolutiva (a fila aberta, ordem do Curador)
ficha_true = 8   # viradas no cadastro: as mesmas 8 (False → True)
termos = 2       # RC-841 (Cronos) e RC-842 (Milésios), por pérola aprovada
relacoes = 0     # nenhuma aresta nova — aresta só tipada + evidência + selo datado
vinculos = 17    # os 17 códigos tocados pelo ciclo passam a carregar P2017-10-14

[materializar]
codigos = ["RC-403", "RC-017", "RC-228", "RC-305", "RC-398", "RC-109", "RC-841", "RC-842"]  # ordem do Curador na devolutiva

[vitorias]
provas = []         # uma linha por vitória: "RC-xxx = <afirmativa> | prova: <trecho>"
# A prova é um trecho LITERAL da `## Ampliação — <SIGLA>` da ficha: o motor confere byte a
# byte depois de ampliar e o §0 do dossiê só imprime o que passou. Mesa vazia é lícita (nem
# todo ciclo vence algo novo); linha sem `| prova:` aborta — vitória narrada não é vitória.
[ampliar]
codigos = []      # vazio = todos os códigos do pacote que já têm arquivo

[tese]
pontos = [
  "O Colégio Druídico (RC-403) é a recriação, na Terra, da escola fundada em Capela pelo Codificador (RC-092) há ~4 milhões de anos — a 1ª transferência desse conhecimento a humanos livres, transmitida pelos povos celtas/gaélicos até a Grécia (filosofia) e depois distorcida por Roma e pelo cristianismo.",
  "O ser humano é o 'protótipo que deu certo': a união dos dois fornos replicadores (RC-771) — a banda sensata dos biodemos (forno de Vishnu/RC-499) + a banda emocional da animalidade (forno de Shiva/RC-837) — o que explica os dois hemisférios cerebrais; quem urdiu a união foi o Codificador.",
  "A rebelião de Lúcifer (RC-002) trouxe o quartel-general a ~97.000 anos; na base Atlan (RC-017) reencontrou a família Val (RC-109), já aqui há 600.000 anos, e dali retomou a tese da escola ('a realidade está doente') e estudou a astralização (RC-026).",
  "A mitologia grega (Caos = Javé, RC-284; Têmis, RC-305; a genealogia Cronos→Zeus) e a irlandesa (Thuata de Dannan, RC-398; Milésios, RC-842) são ecos distorcidos dessa história biodêmica — e Têmis teria introduzido a 1ª mutação genética de 'racionalidade limpa' (honesta).",
]

[definicoes]
RC-403 = "O Colégio Druídico: a recriação, na Terra, da escola que o Codificador fundou em Capela há ~4 milhões de anos — a primeira transferência desse conhecimento a humanos livres, transmitida pelos povos celtas/gaélicos e depois distorcida por Roma e pelo cristianismo."
RC-017 = "Alt´Lam (base Atlan): a grande base atlântica terrestre, assentada no perímetro de ~2 km onde hoje é a cidade de Natal (anagrama de Atlan); o ponto do reencontro entre os biodemos rebeldes e a família Val."
RC-228 = "Observação de Sileno: a resposta do demo sábio (capturado por Midas) — 'o melhor para o ser humano seria jamais ter nascido; já que nasceu, morrer o quanto antes' — a leitura biodêmica do drama de Caos/Javé."
RC-305 = "Têmis (titã): a primeira a desenvolver a 'racionalidade limpa' (honesta); deusa dos juramentos (não da justiça) e a primeira associada ao oráculo de Delfos; teria introduzido a mutação genética da sensatez na humanidade."
RC-398 = "Thuata de Dannan: povo não-humano da mitologia irlandesa (STT 'toatas de ganã') que chegou queimando os próprios navios e, derrotado, astralizou-se — origem das fadas/gnomos do folclore celta."
RC-109 = "Val (Família Val): a mais recente família biodêmica (surgida há ~230 milhões de anos), que já habitava a Terra há ~600.000 anos quando o quartel-general rebelde aportou; não participou da deflagração da rebelião."
RC-841 = "Cronos (titã): na genealogia grega, filho de Uranos e pai de Zeus — a geração dos Titãs; usurpou o pai e foi usurpado pelo filho, lido como eco distorcido da história biodêmica."
RC-842 = "Milésios: a última raça a aportar na Irlanda, que herdou o conhecimento druídico e fundou as primeiras origens do Colégio Druídico — cuja tese foi transplantada de Capela."

