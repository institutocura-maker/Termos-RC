[definicoes]
RC-080 = '''**Mensagem Talm** é, no cadastro, o artefato documental do Projeto Talm (Tecnologias & Artefatos / Escrituras). Esta fonte oral de 30/01/2021 é a primeira dedicada ao termo e a mais antiga do verbete: a mensagem é lida integralmente, e o drama central — ela não foi respondida e não será tão cedo — é enunciado pela fonte como fato presente. A resposta depende de um eu de Javé que sucumbiu (RC-001), e o único pensamento dos fenvans (RC-064) é aguardá-la.'''

RC-064 = '''**Fenvans** é a classe de seres que mora na intercessão entre os dois universos (Seres & Entidades / Extraterrestres). Esta fonte oral de 30/01/2021 é a mais antiga do verbete e a mais densa sobre a gênese: os fenvans surgiram há cerca de 7 bilhões de anos, gerados por Morren So (RC-081) como suicidas programados — de pensamento único, e os únicos portadores de genes críticos (RC-710). Executaram o Projeto Talm à maneira deles.'''

RC-776 = '''**Ginnungagap** é, no cadastro, a zona intercessória entre os universos (Lokas & Geografias / Regiões cósmicas). Esta fonte oral de 30/01/2021 é a mais antiga do verbete: a fonte lê a intercessão por dois mitos em paralelo — o nórdico (Ymir, o gigante que lá permaneceu 18.000 anos) e o chinês (Pangu, o criador caído) — e situa nela a queda de Pradrag, reconstruído como Javé/Inir/Pancu. Nada é harmonizado: os três nomes entram como a fonte os diz.'''

RC-564 = '''**Fios soltos** é, no cadastro, o termo que nomeia a condição humana como improviso (Conceitos Cosmológicos / Propósitos). Esta fonte oral de 30/01/2021 é a mais antiga do verbete e a que dá o título da palestra: cada humano é um fio solto ainda por alinhar; o fio desencapado que dá choque é Javé (RC-001), e o trabalho humano é recapeá-lo.'''

RC-081 = '''**Mohen So (Morren So)** é o avatar de Vishnu que idealizou o Projeto Talm. A fonte oral de 30/01/2021 fixa a divisão: o projeto foi idealizado por Morren So, mas executado pelos fenvans (RC-064) à maneira deles; e Morren So pegou o manual de Moros (RC-454) para medir a podridão do corpo de Javé (o PIA, RC-716). A grafia STT da fonte é "Morençou/Morrensor/Morrençor" — registrada, não unificada (a unificação Mohen So × Morren So segue pendente).'''

RC-089 = '''**Processador Val** é, no cadastro, a tecnologia/nave do Projeto Talm. A fonte oral de 30/01/2021 acrescenta o quarto canal de notícias (os e-mails/whatsapps do processador) e a criação de uma nova espécie biodemo a partir do Processador Val de Alto Longron — o veículo para o novo eu de Javé.'''

RC-091 = '''**Projeto Talm** é o projeto de semeadura de vida. A fonte oral de 30/01/2021 é a mais antiga do verbete e fixa a divisão de papéis: idealizado por Morren So (RC-081), executado pelos fenvans (RC-064) — "à maneira deles", que determinou o ritmo da coisa.'''

RC-036 = '''**Biodemos** é a classe de seres biológicos do universo vizinho. A fonte oral de 30/01/2021 acrescenta a escala de Kardashev: os biodemos, com quase 250.000 espécies espalhadas na galáxia, já são uma civilização tipo 2 — a menos emotiva do universo biológico, e por isso o destino escolhido para o novo eu de Javé.'''

RC-541 = '''**Evolução Possível** é, no cadastro, a terceira via (nem Darwin, nem deus). A fonte oral de 30/01/2021 é a mais antiga do verbete: anuncia o livro "Nem Deus, nem Javé, nem Darwin — a evolução possível" como concluído, e o tema do "império do mais forte" como tocado superficialmente nele.'''

RC-467 = '''**Moiras / Nornes / Parcas** é, no cadastro, o destino. A fonte oral de 30/01/2021 fixa a origem: Moros (RC-454), antes de sumir, criou três seres não-sexuados que a mitologia grega leu como três mulheres — as moiras teciam o fio solto dos deuses, mas só mediam o tamanho da possibilidade de cada demo; nada mais.'''

RC-710 = '''**Genes Críticos** é, no cadastro, a classe de genes que permite a uma espécie criar outra. A fonte oral de 30/01/2021 é a mais antiga do verbete (anterior a P2021-05-15): só os fenvans têm esses genes críticos, porque foram criados para se transformar em qualquer coisa do outro lado do portal — o que os demos nunca tiveram.'''

RC-716 = '''**PIA — Peso da Inevitabilidade Ancestral** é, no cadastro, o peso medido por Moros. A fonte oral de 30/01/2021 é a mais antiga do verbete (antes de P2024-11-30): Morren So (RC-081) pegou o manual de Moros (RC-454) e mediu o peso da infecção ancestral de cada microparte do corpo de Javé — o PIA como a medição que definiu o destino de servilismo dos fenvans.'''

RC-009 = '''**Sophia** é, no cadastro, o Cristo Cósmico. A fonte oral de 30/01/2021 acrescenta a caracterização como biodemo (emoção 0,1; percepção 0,2; tirocínio 0,3) — inferior ao humano na compreensão — e a "vanguarda do atraso": Sophia não pode responder a mensagem Talm e precisa da interação humana para recolher as quálias.'''

RC-092 = '''**Quarto Logos (Olm)** é, no cadastro, o Codificador de Zian. A fonte oral de 30/01/2021 contrapõe o Quarto Logos ao "império do mais forte" dos três primeiros logos: é a grande novidade que convida os humanos não a exercer o império da força mental estupidificada, mas a promover a própria evolução pela especiação.'''

RC-001 = '''**Javé** é, no cadastro, o Senhor Javé. A fonte oral de 30/01/2021 acrescenta o drama do novo eu: o eu de Javé sucumbiu (foi ceifado pelas próprias circunstâncias que impôs) e está sendo lentamente estruturado para ser imantado numa nova espécie biodemo — condição para que a mensagem Talm seja respondida. O corpo de Javé tem uma cópia na intercessão (RC-776), levada pelos fenvans.'''

