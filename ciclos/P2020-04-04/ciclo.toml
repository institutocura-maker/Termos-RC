[definicoes]

[observacoes]
RC-001 = "**Tese central do titulo:** Jave e um 'ser desalmado' (eu apartado do proprio espirito), e 'Jave e Jesus sao duas faces de uma mesma moeda' sustentadas pelo mesmo espirito alfa. O espirito usa Sofia e Jesus para 'juntar tres em um' e recompor o eu desalmado de Jave."
RC-009 = "**A trindade:** 'Jave, Sofia e Jesus representam a trindade que a turma nunca percebeu'. Ironicamente, a Santissima Trindade catolica 'nao existe' - a trindade verdadeira e esta, cosmica. Sofia herdara o universo ('Sofia vai herdar tudo') e conduzira a vinda."
RC-072 = "**Continuidade com o F044:** o mesmo nucleo do curso - Jesus 'a destinacao terrivel de ser aquele Messias violento', que 'nunca quis assumir aquilo' e nao cumpriu as profecias das escrituras judaicas. Corrobora o RC-942 Messias (consolidado no Anel C do F044)."
RC-003 = "**Qualificacao:** 'A reintegracao cosmica meio que e refem da vinda de Sofia' - a fase clasica so comeca apos a vinda; a extraterrestre limitada ja ocorre, mediada pela familia Aia."

[travas]
RC-009 = "quarentena ufologica/biomediunica: a vinda de Sofia e as naves ('as naves todas ja darao', os governos que sabem) - restam no contexto de palestra; o conteudo curado entra sem detalhe tecnologico especulativo."

