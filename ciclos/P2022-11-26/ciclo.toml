cobertura = "GARIMPO INTEGRAL — palestra VERBATIM (fala original de Ellam, transcrição STT, não refatorada) lida na íntegra (104.545 chars / 15 linhas / 11 com fala / 18.769 palavras; cobertura 7/7 fatias provada). Tese: os 'donos da verdade' (espiritualidade superior, universo vizinho, outros universos criados e parte da erraticidade) são os que se sentem donos — de seres, de realidades, de verdades impositivas, de realidades introjetadas ou de si mesmos; sentir-se dono é circuito fechado: a regra gerada na quebra dos protocolos da perfeição obriga que tudo que vai volte (bumerangue quântico, não justiça). O primeiro choque de realidade começou com o fechamento total dos portais em 2012 — acabou a hipótese de conquista da Trimurti, as colmeias colapsavam desde 2007; a notícia: 'estamos todos doentes' — a doença do criador infectou não só para dentro, mas também para fora, sem imunidade de rebanho. O espírito de Jesus está perdido: restam só duas expressões (Sofia, radiata — cérebro radiata, engendrado há ~5 bilhões de anos — e Javé, 'o cancro'); os arcontes se recusam a dar a vestimenta do Suzerano a Sofia; o Conselho de Antiandel 'não funciona, tipo a ONU'; é zero a construção do tikum; tudo se resume ao tipo de proteína que as raças do universo biológico produzirão para reconstruir o corpo do criador — o corpo humano como ilha de negentropia (RC-725). Recolhe formulações PRECISAS para 16 códigos (14 com ficha: RC-295, RC-104, RC-174, RC-657, RC-783, RC-414, RC-072, RC-009, RC-631, RC-001, RC-474, RC-514, RC-725, RC-562; 2 em fila aberta: RC-520, RC-859). NENHUM termo novo por conta própria: 7 candidatos declarados no BLOCO 2 (choque de realidade; donos da verdade/cinco níveis de posse; genoma da dignidade; conselho de Antiandel; mentalidade comum; escala de Kardachev — fonte externa, navalha a decidir; saga Irém — Universo em Colisão — obra), decisão do Curador. Fonte integral preservada em original.txt, selada por SHA-256 na entrada; livro-razão de âncoras registra cada span encontrado, aceito e recusado."
