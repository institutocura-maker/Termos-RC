cobertura = "GARIMPO INTEGRAL — palestra VERBATIM (fala original de Ellam, transcrição STT, não refatorada) lida na íntegra (113.308 B / 81 linhas / 43 com fala / 19.662 palavras / 109.430 chars; cobertura 7/7 fatias provada; maior linha 33.954 chars). Tese: a tragédia anunciada de Javé e da linhagem demo — as fórmulas mentais do poder. O psiquismo funciona por arquivos (coleção), algoritmos (arquivos organizados) e fórmulas mentais (programas cerebrais que viram talentos); o demo é prisioneiro das fórmulas que colecionou ou recebeu (uma fórmula mental manda num demo; duas mandam num demo), enquanto o humano tem plasticidade e livre-arbítrio para gerir o próprio eu (Nós humanos podemos ser pior que o leão, pior que o demo, melhor que Deus). As fórmulas de poder demo se ancoram em egrégoras que adquiriram vida própria — e Javé morreu sufocado pelas próprias egrégoras, morto pelos próprios elétrons (a rebelião dos elétrons; livro 1 de 11 já lançado); nunca houve rebelião de Lúcifer no universo vizinho — só no biológico e na classe biodia (Odim, Luisbell). A história demo: Ravana como maior colecionador de fórmulas mentais (de Chiva e Brama; humilhou Zeus/Indra; Chiva se fez Rama para destruí-lo), Zeus que dá ordens que nem ele entende, Brama que aceitou o marra samadi (maha samadhi) e se desconstituiu. O tempo como modo como o psiquismo se movimenta (surgiu como decorrência do projeto mental deteriorado). O roteiro do absurdo: carga virótica um (protoceres viróticos antimateriais — vírus como face do criador caído; todas as doenças) e carga virótica dois (vírus biológicos; COVID-19 o mais novo membro); o projeto Talm mandou o Nidana para semear o universo biológico; holografia (28.869 genes em cada célula); 226 genes da central de defesa (sistema imunológico; 3.600 espécies de vírus por segundo); 86 bi neurônios e 100 tri teias quânticas; a criatura universal e a mente biocosmos emergente para ressuscitar o eu de Javé; os atos performativos (as palavras que fazem cois